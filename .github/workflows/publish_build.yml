name: Publish Latest Build

# Publishes the APKs of a successful "Build" run as the "latest-build" pre-release,
# replacing the previous one, so they can be downloaded as plain .apk files at a
# fixed address (workflow artifacts need a GitHub login and come zipped).

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch whose latest successful build to publish
        required: true
        default: scene-menu
  # Only takes effect once this file is on the default branch.
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  # Pushing the "publish" tag publishes the build of the commit it points to. A tag
  # push runs this file as of that commit, so it works before it's on the default branch.
  push:
    tags: [publish]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-latest-build

jobs:
  publish:
    name: Publish latest build
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ inputs.branch }}

    steps:
      - name: Find the build
        id: build
        env:
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ -n "$EVENT_RUN_ID" ]; then
            run_id="$EVENT_RUN_ID"
            sha="$EVENT_SHA"
            branch="$EVENT_BRANCH"
          else
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              filter=(--commit "$GITHUB_SHA")
            else
              filter=(--branch "$BRANCH")
            fi
            run=$(gh run list --workflow build.yml "${filter[@]}" --status success \
              --limit 1 --json databaseId,headSha,headBranch --jq '.[0]')
            if [ -z "$run" ]; then
              echo "No successful Build run for ${filter[*]}"
              exit 1
            fi
            run_id=$(jq -r .databaseId <<< "$run")
            sha=$(jq -r .headSha <<< "$run")
            branch=$(jq -r .headBranch <<< "$run")
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "subject=$(gh api "repos/$GH_REPO/commits/$sha" --jq '.commit.message' | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Download APKs
        run: gh run download "${{ steps.build.outputs.run_id }}" --name ruffle-release-apks --dir apks

      - name: Publish release
        env:
          SUBJECT: ${{ steps.build.outputs.subject }}
          BUILD_BRANCH: ${{ steps.build.outputs.branch }}
        # The tag goes on the default branch, since the workflow token may not create
        # tags on commits that add workflow files the default branch doesn't have yet.
        run: |
          gh release delete latest-build --cleanup-tag --yes || true
          gh release create latest-build apks/*.apk \
            --target "$(gh api "repos/$GH_REPO" --jq .default_branch)" \
            --prerelease \
            --title "Latest build ($BUILD_BRANCH)" \
            --notes "Built from commit ${{ steps.build.outputs.sha }} (\"$SUBJECT\") by [this Build run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.build.outputs.run_id }}). If unsure which APK your device needs, install the universal one."
